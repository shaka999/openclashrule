[custom]
;不要随意改变关键字，否则会导致出错
;ac14SSR规则-在线更新版（中国用户优化版） - CDN优化版
;优化：规则集全部走 jsdelivr CDN（国内可访问，防止拉取失败/缓存失效）
;    GEOIP 加 no-resolve 防 DNS 泄漏
;    补充私网直连 / Cloudflare 分流（不新增策略组）
;====== 基础配置 ======
;使用仓库里的基础模板 (allow-lan / 控制端 / DNS / sniffer / TUN)
clash_rule_base=https://testingcf.jsdelivr.net/gh/shaka999/openclashrule@main/clash_base.yaml
;去广告：支持 (BanAD + 程序广告净化)
;自动测速：支持 (url-test 300s / 容差50)
;微软分流：支持
;苹果分流：支持
;增强中国IP段：支持 (GEOIP,CN / GEOIP,PRIVATE 兜底直连)
;GFW列表：支持 (被墙站点走代理，FINAL 漏网之鱼兜底)
;AI 分流：支持 (Gemini / Copilot / OpenAI / Claude / Perplexity / Poe / Cursor / Mistral / xAI / Google / Meta)
;游戏平台：增强 (Epic/Origin/Sony/Steam/Nintendo/Blizzard/Riot)
;流媒体/通讯：增强 (Netflix/Spotify/Discord/YouTube/Google/Facebook/Instagram/TikTok/Twitch 走代理)
;开发工具：支持 (GitHub / GitLab / Docker 走代理)
;HuggingFace / PT 直连：支持 (HF CDN 与 PT 站点直连)
;Play 商店：页面走代理，APK 下载 CDN 走向国内直连
; --------- 自定义直连 (HuggingFace / PT) ---------
ruleset=DIRECT,https://testingcf.jsdelivr.net/gh/shaka999/openclashrule@main/hf_pt_direct.list
ruleset=♻️ 自动选择,https://testingcf.jsdelivr.net/gh/shaka999/openclashrule@main/dns_upstream.list
; --------- 私网直连（新增） ---------
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
; --------- 基础分流 ---------
ruleset=🎯 全球直连,https://testingcf.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://testingcf.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/UnBan.list
ruleset=🛑 全球拦截,https://testingcf.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanAD.list
ruleset=🍃 应用净化,https://testingcf.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanProgramAD.list
ruleset=📺 国内媒体,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/ChinaMedia/ChinaMedia.list
ruleset=📢 谷歌FCM,https://testingcf.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/GoogleFCM.list
