[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则-在线更新版（中国用户优化版）

;去广告：支持（BanAD + 程序广告净化）
;自动测速：支持（url-test 300s / 容差50）
;微软分流：支持
;苹果分流：支持
;增强中国IP段：支持（GEOIP,CN / GEOIP,PRIVATE 兜底直连）
;AI 分流：支持（Gemini / Copilot / OpenAI / Claude）
;游戏平台：增强（Epic/Origin/Sony/Steam/Nintendo/Blizzard/Riot）
;流媒体/通讯：增强（Netflix/Spotify/Discord 走代理）

; ---------- 基础分流 ----------
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🍃 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🎞️ 国内媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMedia/ChinaMedia.list
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list

; ---------- AI 分流（增强） ----------
ruleset=🤖 AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Gemini/Gemini.list
ruleset=🤖 AI,https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/69ba79a635d5a822b36b702aedce2147eb31ab16/rules/loon/copilot.list
ruleset=🤖 AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=🤖 AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Anthropic/Anthropic.list

