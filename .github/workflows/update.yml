name: 更新节点配置

on:
  schedule:
    - cron: "0 2 * * *" # 每天 10:00（北京时间）自动更新
  workflow_dispatch:
    inputs:
      sub_url:
        description: "订阅地址（留空则使用仓库 Secret SUB_URL）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 启动订阅转换服务
        run: |
          docker run -d --name subconverter -p 25500:25500 tindy2013/subconverter
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:25500/version >/dev/null 2>&1; then
              echo "subconverter 已就绪"
              break
            fi
            sleep 2
          done

      - name: 下载并转换订阅
        env:
          SUB_URL: ${{ github.event.inputs.sub_url || secrets.SUB_URL }}
        run: |
          set -e
          if [ -z "$SUB_URL" ]; then
            echo "没有订阅地址：请在仓库 Settings -> Secrets and variables -> Actions 添加 SUB_URL，或用“手动运行”时填写订阅地址。"
            exit 1
          fi
          ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$SUB_URL")
          CONFIG="https%3A%2F%2Fraw.githubusercontent.com%2Fshaka999%2Fopenclashrule%2Fmain%2FACL4SSR_Online_optimized.ini"
          if curl -fsSL "http://127.0.0.1:25500/sub?target=clash&url=${ENCODED}&config=${CONFIG}" -o raw.yaml && [ -s raw.yaml ]; then
            echo "订阅转换成功"
          else
            echo "订阅转换失败，尝试直接下载订阅"
            curl -fsSL "$SUB_URL" -o raw.yaml
          fi
          test -s raw.yaml

      - name: 生成优化版配置
        run: |
          pip install pyyaml
          python scripts/optimize.py raw.yaml 节点.yaml

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 节点.yaml
          if git diff --cached --quiet; then
            echo "配置无变化，跳过提交"
          else
            git commit -m "chore: 更新节点配置"
            git push
          fi
